<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRAINING">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0a0b">
<link rel="apple-touch-icon" href="IMG_9058.jpeg">
<title>TRAINING LOG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラムの縦長アプリ。ホーム → 日選択 → 種目。推移・振り返り・編集は別画面。下部に固定の休憩タイマー。黒地に白、罫線で区切る。 */
:root {
  --bg: #0a0a0b;
  --surface: #131315;
  --surface-2: #1b1b1e;
  --line: #2a2a2e;
  --fg: #f4f4f2;
  --mute: #8d8d95;
  --dim: #5b5b62;
  --ok: #8fc9a9;
  --up: #f0c987;
  --err: #e58b83;
  --on-fg: #0a0a0b;
  --f-display: 'Inter', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  --f-body: 'Noto Sans JP', 'Inter', system-ui, -apple-system, 'Hiragino Sans', sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  padding-block: 20px 170px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
h1, h2, h3, p, dl, dd, dt { margin: 0; }
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.eyebrow { font-family: var(--f-display); font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
.mute { color: var(--mute); font-size: 13px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

/* home */
.brand { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; }
.brand h1 { font-family: var(--f-display); font-weight: 300; font-size: 36px; letter-spacing: .06em; line-height: 1.1; }
.brand .sub { color: var(--mute); font-size: 13px; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.lead { font-size: 12px; letter-spacing: .12em; color: var(--mute); }
.days { display: flex; flex-direction: column; gap: 12px; }
.daycard { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 20px; width: 100%; padding: 20px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; }
.daycard:active { background: var(--surface-2); }
.letter { font-family: var(--f-display); font-size: 68px; font-weight: 200; line-height: 1; width: 52px; }
.dc-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dc-sub { font-size: 16px; font-weight: 500; }
.dc-meta { font-size: 12px; color: var(--mute); }
.tag { font-family: var(--f-display); font-size: 10px; letter-spacing: .16em; border: 1px solid var(--fg); padding: 2px 8px; border-radius: 2px; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
.rows .row:last-child { border-bottom: 1px solid var(--line); }
.rw { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.rw b { font-weight: 500; font-size: 15px; }
.chev { color: var(--mute); font-size: 20px; line-height: 1; }
.warn { font-size: 12px; color: var(--up); }

/* top bar */
.topbar { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.back { min-height: 44px; display: inline-flex; align-items: center; color: var(--mute); font-size: 14px; padding-right: 16px; }
.pos { font-family: var(--f-display); font-size: 12px; letter-spacing: .12em; color: var(--mute); font-variant-numeric: tabular-nums; }
.title { font-family: var(--f-display); font-weight: 300; font-size: 30px; line-height: 1.2; letter-spacing: .02em; }
.h3 { font-size: 16px; font-weight: 500; }
.progress { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--mute); }
.progress .bar { flex: 1; height: 2px; background: var(--line); }
.progress .bar i { display: block; height: 100%; background: var(--fg); }

/* day list */
.exlist { display: flex; flex-direction: column; }
.ex { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; width: 100%; padding: 16px 0; border-top: 1px solid var(--line); min-width: 0; }
.exlist .ex:last-child { border-bottom: 1px solid var(--line); }
.ex .no { font-family: var(--f-display); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.ex-b { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ex-n { font-size: 16px; font-weight: 500; }
.ex-m, .ex-l { font-size: 12px; color: var(--mute); }
.ex-l { color: var(--dim); }
.ex .st { font-size: 13px; color: var(--mute); min-width: 28px; text-align: right; }
.ex.ok .st { color: var(--ok); }
.ex.ok .ex-n { color: var(--mute); }
.prt { font-family: var(--f-display); font-size: 10px; font-weight: 600; letter-spacing: .1em; color: var(--on-fg); background: var(--up); border-radius: 2px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }

/* exercise */
.exname { font-size: 28px; font-weight: 500; line-height: 1.3; }
.facts { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.facts > div { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.facts dt { color: var(--mute); font-size: 12px; letter-spacing: .08em; padding-top: 1px; }
.facts dd { min-width: 0; }
.goalbox { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.gb-row { display: grid; grid-template-columns: 64px 1fr; gap: 12px; font-size: 14px; }
.gb-k { color: var(--mute); font-size: 12px; letter-spacing: .08em; padding-top: 2px; }
.gb-v { font-family: var(--f-display); font-variant-numeric: tabular-nums; min-width: 0; }
.gb-row.hi .gb-v { font-weight: 600; }
.badge { font-size: 12px; color: var(--up); }
.sets { display: flex; flex-direction: column; gap: 12px; }
.set { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.set.done { border-color: var(--ok); }
.set-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lab { font-family: var(--f-display); font-size: 12px; letter-spacing: .16em; font-weight: 500; }
.lab i { font-style: normal; color: var(--dim); }
.chk { min-width: 92px; height: 40px; border: 1px solid var(--fg); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; }
.set.done .chk { background: var(--ok); border-color: var(--ok); color: var(--on-fg); }
.set-b { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld label { font-size: 11px; color: var(--mute); letter-spacing: .08em; }
.stp { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; }
.stp button { height: 48px; border: 1px solid var(--line); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; color: var(--mute); }
.stp button:active { background: var(--surface-2); }
.stp input { width: 100%; min-width: 0; height: 48px; background: transparent; border: 0; color: var(--fg); text-align: center; font-family: var(--f-display); font-size: 26px; font-weight: 300; font-variant-numeric: tabular-nums; border-radius: 0; -moz-appearance: textfield; appearance: textfield; }
.stp input::-webkit-outer-spin-button, .stp input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.err { color: var(--err); font-size: 13px; }
.primary { width: 100%; min-height: 54px; background: var(--fg); color: var(--on-fg); border-radius: 4px; text-align: center; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.primary:disabled { opacity: .3; }
.ghost { width: 100%; min-height: 50px; border: 1px solid var(--line); border-radius: 4px; text-align: center; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.ghost.danger, .danger { border-color: var(--err); color: var(--err); }
.stepset { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--mute); }
.stepset input { width: 84px; height: 40px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; color: var(--fg); text-align: center; font-family: var(--f-display); font-size: 16px; }
.memo { min-height: 64px; }
textarea { width: 100%; min-height: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; color: var(--fg); padding: 10px; font-family: var(--f-body); font-size: 14px; resize: vertical; }
#bk { font-family: var(--f-display); font-size: 12px; }

/* records, charts */
.recbox { border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.recbox .gb-row { grid-template-columns: 76px 1fr; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.gr { width: 100%; height: auto; display: block; }
.gr text { fill: var(--mute); font-family: var(--f-display); font-size: 10px; }
.gr .gl { stroke: var(--line); stroke-width: 1; }
.gr .ln { stroke: var(--fg); fill: none; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.gr .dt { fill: var(--fg); }
.gr .dp { fill: var(--up); }
.gr .lv { fill: var(--fg); font-size: 11px; font-weight: 600; }
.spark { width: 84px; height: 28px; flex: none; }
.spark .ln { stroke: var(--fg); fill: none; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.spark .dt { fill: var(--fg); }
.trow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 14px 0; border-top: 1px solid var(--line); min-width: 0; }
.tlist .trow:last-child { border-bottom: 1px solid var(--line); }
.t-b { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.t-n { font-size: 15px; font-weight: 500; }
.t-m { font-family: var(--f-display); font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
.d-up { color: var(--ok); }
.d-dn { color: var(--err); }
.tbl { width: 100%; border-collapse: collapse; font-family: var(--f-display); font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-weight: 400; color: var(--mute); font-size: 11px; letter-spacing: .08em; padding: 6px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td:last-child, .tbl th:last-child { text-align: right; }
.tblw { overflow-x: auto; }

/* weekly */
.wknav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.wknav button { height: 48px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--mute); }
.wknav button:disabled { opacity: .25; }
.wknav span { text-align: center; font-family: var(--f-display); font-size: 14px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stats > div { display: flex; flex-direction: column; gap: 2px; padding: 12px 0; min-width: 0; }
.stats > div + div { padding-left: 12px; border-left: 1px solid var(--line); }
.stats b { font-family: var(--f-display); font-weight: 300; font-size: 28px; line-height: 1.1; }
.stats span { font-size: 11px; color: var(--mute); }
.hl { display: grid; grid-template-columns: 64px 1fr; gap: 12px; font-size: 14px; }
.hl dt { color: var(--mute); font-size: 12px; letter-spacing: .08em; padding-top: 2px; }
.wcard { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.wc-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.wc-h b { font-size: 16px; font-weight: 500; }
.wc-t { display: inline-flex; align-items: center; gap: 6px; flex: none; }
.chip { font-size: 11px; border: 1px solid currentColor; border-radius: 2px; padding: 0 8px; line-height: 20px; }
.c-up { color: var(--ok); }
.c-dn { color: var(--err); }
.c-st { color: var(--up); }
.c-fl, .c-fi { color: var(--mute); }
.wc-d { display: flex; flex-direction: column; }
.wc-d > div { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.wc-d dt { color: var(--mute); font-size: 12px; letter-spacing: .06em; }
.wc-d dd { font-family: var(--f-display); font-variant-numeric: tabular-nums; min-width: 0; }

/* history, edit */
.day-g { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.day-gh { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-display); font-size: 13px; font-variant-numeric: tabular-nums; }
.day-gh span { color: var(--mute); font-size: 11px; letter-spacing: .14em; }
.h-it { display: flex; flex-direction: column; font-size: 13px; }
.h-it b { font-weight: 500; }
.h-it span { color: var(--mute); font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.bk { display: flex; flex-direction: column; gap: 12px; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.erow { display: grid; grid-template-columns: 1fr 44px 44px; align-items: center; border-top: 1px solid var(--line); min-width: 0; }
.elist .erow:last-child { border-bottom: 1px solid var(--line); }
.erow > button:first-child { padding: 12px 0; display: flex; flex-direction: column; min-width: 0; }
.erow .mv { height: 48px; display: flex; align-items: center; justify-content: center; color: var(--mute); font-size: 16px; }
.erow .mv:disabled { opacity: .2; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form input[type="text"], .form input[type="number"] { width: 100%; height: 46px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; color: var(--fg); padding: 0 12px; font-family: var(--f-body); font-size: 16px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .chkrow { display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 44px; }
.form .chkrow input { width: 22px; height: 22px; accent-color: #f4f4f2; }

/* timer */
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface-2); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tm-in { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.tm-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tm-l { display: flex; align-items: baseline; gap: 12px; }
.tm-label { font-size: 12px; letter-spacing: .12em; color: var(--mute); }
.tm-time { font-family: var(--f-display); font-weight: 300; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.tm-btns { display: flex; gap: 8px; }
.tm-btns button { height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; display: inline-flex; align-items: center; }
.tm-btns .solid { background: var(--fg); color: var(--on-fg); border-color: var(--fg); font-weight: 700; }
.tm-bar { height: 2px; background: var(--line); }
.tm-bar i { display: block; height: 100%; width: 0; background: var(--fg); }
.timer.end .tm-time, .timer.end .tm-label { color: var(--up); }
.timer.end .tm-bar i { background: var(--up); }
@media (prefers-reduced-motion: no-preference) { .tm-bar i { transition: width .25s linear; } }
</style>
</head>
<body>

<div id="app"></div>

<div id="timer" class="timer" hidden>
  <div class="tm-in">
    <div class="tm-row">
      <div class="tm-l"><span class="tm-label" id="tmLabel">休憩</span><span class="tm-time" id="tmTime">0:00</span></div>
      <div class="tm-btns">
        <button type="button" data-t="-15">−15</button>
        <button type="button" data-t="15">+15</button>
        <button type="button" data-t="skip" class="solid">スキップ</button>
      </div>
    </div>
    <div class="tm-bar"><i id="tmBar"></i></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'trainingLog.v1';
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var DAYS = { A: { label: 'A DAY', sub: '胸・肩・三頭・脚' }, B: { label: 'B DAY', sub: '背中・肩後部・二頭・脚' } };

  var DEFAULT_MENU = {
    A: [
      { id: 'a1', name: 'インクラインDBプレス', sets: 3, min: 8, max: 12, rest: 120, aim: '大胸筋上部', alt: 'インクラインマシンプレス', step: 2 },
      { id: 'a2', name: 'ディップス', sets: 2, min: 8, max: 12, rest: 120, aim: '大胸筋下部・三頭筋', alt: 'チェストプレス', step: 2.5, bw: true },

      { id: 'a5', name: 'DBショルダープレス', sets: 2, min: 8, max: 12, rest: 90, aim: '三角筋前部・中部', alt: 'ショルダープレスマシン', step: 2 },
      { id: 'a6', name: 'EZバーフレンチプレス', sets: 2, min: 10, max: 12, rest: 60, aim: '三頭筋長頭', alt: 'ケーブルOHエクステンション', step: 2.5 },
      { id: 'a7', name: 'ローププレスダウン', sets: 2, min: 10, max: 15, rest: 60, aim: '三頭筋外側頭を含む全体', alt: 'Vバープレスダウン', step: 2.5 },
      { id: 'a8', name: 'レッグプレス', sets: 2, min: 10, max: 15, rest: 90, aim: '大腿四頭筋・臀筋', alt: 'レッグエクステンション', step: 5 },
      { id: 'a9', name: 'シーテッドカーフレイズ', sets: 2, min: 12, max: 20, rest: 60, aim: 'ヒラメ筋', alt: 'レッグプレスカーフレイズ', step: 2.5 }
    ],
    B: [
      { id: 'lp', name: 'ラットプル', sets: 3, min: 8, max: 12, rest: 120, aim: '広背筋・大円筋', alt: '片手ケーブルプルダウン', step: 2.5 },
      { id: 'sr', name: 'シーテッドロウ', sets: 3, min: 8, max: 12, rest: 120, aim: '広背筋・僧帽筋中部・菱形筋', alt: 'マシンロー／DBロー', step: 2.5 },
      { id: 'sa', name: 'ストレートアームプルダウン', sets: 2, min: 12, max: 15, rest: 60, aim: '広背筋(伸張位)・大円筋', alt: 'DBプルオーバー', step: 2.5 },
      { id: 'b4', name: 'フェイスプル', sets: 2, min: 12, max: 20, rest: 60, aim: '三角筋後部・僧帽筋中下部', alt: 'リアデルトフライ', step: 2.5 },
      { id: 'b5', name: 'インクラインDBカール', sets: 2, min: 10, max: 12, rest: 60, aim: '上腕二頭筋', alt: 'プリーチャーカール', step: 1 },
      { id: 'b6', name: 'ハンマーカール', sets: 2, min: 10, max: 15, rest: 60, aim: '腕筋・腕橈骨筋', alt: 'ロープハンマーカール', step: 1 },

  /* ---------- numbers ---------- */
  function wl(w, ex) {

    var w = Number(s.w) || 0, r = Number(s.r) || 0;

    return e1(w, r);

  function sessVal(ex, sets) {
    var m = 0;
    sets.forEach(function (s) { var v = setVal(ex, s); if (v > m) m = v; });

  function fmtV(v, ex) { return repsMode(ex) ? Math.round(v) + '回' : nf1(v) + 'kg'; }
  function sgn(d, ex) {
    var x = repsMode(ex) ? Math.round(d) : Math.round(d * 10) / 10;
    return (x > 0 ? '+' : x < 0 ? '−' : '±') + Math.abs(x) + (repsMode(ex) ? '回' : 'kg');

  function exOf(h) { return findEx(h.id) || { id: h.id, name: h.name, bw: false }; }

    var prior = sessions(ex.id).filter(function (h) { return h.date !== date; });
    if (!prior.length) return null;

    prior.forEach(function (h) {

      h.sets.forEach(function (s) { if (s.w > w) w = s.w; });

  function prInfo(ex, sets, date) {

  function bestOf(ex) {
    var ss = sessions(ex.id);

      h.sets.forEach(function (s) {

  /* ---------- double progression ---------- */
  function computeTarget(ex) {

    var all = last.sets.every(function (s) { return Number(s.r) >= ex.max; });
    var sets = Array.from({ length: ex.sets }, function (_, i) {

      return { w: Number(s.w), r: Math.min(ex.max, Number(s.r) + 1) };

  }

  /* ---------- charts ---------- */
  function tickFmt(v, ex, span) { return repsMode(ex) ? String(Math.round(v)) : (span >= 20 ? String(Math.round(v)) : nf1(v)); }
  function chartSvg(pts, ex) {
    if (!pts.length) return '';
    var W = 340, H = 170, L = 40, R = 16, T = 18, B = 26;
    var vs = pts.map(function (p) { return p.v; });
    var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
    var lo, hi;
    if (mx - mn < 1e-9) { lo = mn - 1; hi = mx + 1; }
    else { var pd = (mx - mn) * 0.14; lo = mn - pd; hi = mx + pd; }
    if (mn >= 0 && lo < 0) lo = 0;

    function Y(v) { return T + (H - T - B) * (1 - (v - lo) / span); }
    var g = '';
    [0, 1, 2].forEach(function (k) {
      var v = lo + span * k / 2, y = Y(v);
      g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>' +
        '<text x="' + (L - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + tickFmt(v, ex, span) + '</text>';
    });
    var line = pts.map(function (p, i) { return X(i).toFixed(1) + ',' + Y(p.v).toFixed(1); }).join(' ');
    var dots = '';
    pts.forEach(function (p, i) {
      dots += '<circle class="' + (p.pr ? 'dp' : 'dt') + '" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (p.pr ? 4 : 3) + '"/>';
    });

    var anchor = pts.length === 1 ? 'middle' : 'end';
    var lt = '<text class="lv" x="' + lx.toFixed(1) + '" y="' + (ly - 9).toFixed(1) + '" text-anchor="' + anchor + '">' + fmtV(last.v, ex) + '</text>';
    var xl;
    if (pts.length === 1) xl = '<text x="' + lx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + md(pts[0].date) + '</text>';
    else xl = '<text x="' + L + '" y="' + (H - 8) + '" text-anchor="start">' + md(pts[0].date) + '</text><text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' + md(last.date) + '</text>';
    return '<svg class="gr" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(ex.name) + 'の' + vlabel(ex) + 'の推移">' +
      g + (pts.length > 1 ? '<polyline class="ln" points="' + line + '"/>' : '') + dots + lt + xl + '</svg>';
  }
  function sparkSvg(pts) {
    if (pts.length < 2) return '<span class="mute" style="width:84px;text-align:center">—</span>';
    var W = 84, H = 28, p = 3;

    var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs), sp = mx - mn || 1;

  /* ---------- timer ---------- */
  var T = null, tInt = null, tHide = null, AC = null, wakeLock = null;

    try {

          o.type = 'sine';

          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);

  }

    el('tmBar').style.width = (T.total > 0 ? Math.min(100, 100 * (1 - rem / T.total)) : 100) + '%';
    if (rem === 0) {

  /* ---------- views: weekly review ---------- */
  function weekInfo(off) {
    var ws = addDays(weekStart(today()), off * 7), we = addDays(ws, 6);
    var inW = S.hist.filter(function (h) { return h.date >= ws && h.date <= we; });
    var order = [], seen = {};
    allEx().forEach(function (e) { if (inW.some(function (h) { return h.id === e.id; })) { order.push(e.id); seen[e.id] = 1; } });
    inW.forEach(function (h) { if (!seen[h.id]) { seen[h.id] = 1; order.push(h.id); } });
    var items = order.map(function (id) {
      var ss = sessions(id), idx = -1;
      ss.forEach(function (h, i) { if (h.date >= ws && h.date <= we) idx = i; });
      var ex = findEx(id) || exOf(ss[idx]);
      var cu = ss[idx], pv = idx > 0 ? ss[idx - 1] : null;
      var cv = sessVal(ex, cu.sets), pvv = pv ? sessVal(ex, pv.sets) : null;
      var status;
      if (!pv) status = 'first';
      else {
        var older = 0;
        for (var k = 0; k < idx - 1; k++) { var ov = sessVal(ex, ss[k].sets); if (ov > older) older = ov; }
        var recent = Math.max(cv, pvv);
        if (idx >= 2 && recent <= older + 0.05) status = 'stag';
        else if (cv > pvv + 0.04) status = 'up';
        else if (cv < pvv - 0.04) status = 'dn';
        else status = 'flat';
      }
      return { id: id, ex: ex, known: !!findEx(id), cu: cu, pv: pv, cv: cv, pvv: pvv, status: status, isLatest: idx === ss.length - 1 };
    });
    var dates = {}, nsets = 0, prs = 0;
    inW.forEach(function (h) { dates[h.date] = 1; nsets += h.sets.length; if (h.pr && (h.pr.e || h.pr.w)) prs++; });
    var missing = allEx().filter(function (e) { return !seen[e.id]; });
    return { ws: ws, we: we, items: items, days: Object.keys(dates).length, nsets: nsets, prs: prs, missing: missing, n: inW.length };
  }
  var STL = { up: ['伸び', 'c-up'], dn: ['低下', 'c-dn'], stag: ['停滞', 'c-st'], flat: ['横ばい', 'c-fl'], first: ['初回', 'c-fi'] };

    var w = weekInfo(V.off);
    var h = '<div class="wrap"><div class="topbar"><button type="button" class="back" data-act="back">‹ ホーム</button></div>' +

    h += '<div class="stats"><div><b>' + w.days + '</b><span>実施日数</span></div><div><b>' + w.items.length + '</b><span>実施種目</span></div><div><b>' + w.nsets + '</b><span>総セット</span></div><div><b>' + w.prs + '</b><span>PR</span></div></div>';
    var up = [], st = [], dn = [];

    h += '<dl class="sec">' +

    w.items.forEach(function (it) {
      var ex = it.ex, cu = it.cu, pv = it.pv, s = STL[it.status];
      var pr = cu.pr && (cu.pr.e || cu.pr.w) ? '<span class="prt">PR</span>' : '';

      if (it.known) {
        var full = cu.sets.length >= ex.sets && cu.sets.every(function (x) { return x.r >= ex.max; });
        h += '<div><dt>達成</dt><dd>' + cu.sets.length + ' / ' + ex.sets + ' セット' + (full ? ' · 全セット上限達成' : '') + '</dd></div>';

        }

      h += '</dl></div>';
    });
    if (w.missing.length) h += '<p class="mute">この週に未実施: ' + esc(w.missing.map(function (e) { return e.name; }).join('、')) + '</p>';
    h += '<p class="mute">「停滞」は、直近2回のセッションで、それ以前の最高の推定1RMを超えていない種目です(3回以上の記録が必要)。</p>';
    return h + '</div>';
  }

      '<label class="mute" for="bk">復元するときは、コピーしたデータをここに貼り付けます。</label>' +
      '<textarea id="bk" data-in="bk" spellcheck="false">' + esc(V.bk || '') + '</textarea>' +
      '<div class="btns"><button type="button" class="ghost' + (V.confirm === 'restore' ? ' danger' : '') + '" data-act="restore">' + (V.confirm === 'restore' ? 'もう一度押して上書き' : '貼り付けから復元') + '</button>' +
      '<button type="button" class="ghost' + (V.confirm === 'wipe' ? ' danger' : '') + '" data-act="wipe">' + (V.confirm === 'wipe' ? 'もう一度押して全消去' : '全データを消去') + '</button></div>' +
      (V.msg ? '<p class="mute" role="status">' + esc(V.msg) + '</p>' : '') + '</section></div>';
    return h;
  }

  var app = el('app');
  function render(keep) {
    var y = keep ? window.scrollY : 0;
    var n = V.name;
    app.innerHTML = n === 'home' ? viewHome() : n === 'day' ? viewDay() : n === 'ex' ? viewEx() : n === 'trends' ? viewTrends() :
      n === 'trend' ? viewTrend() : n === 'week' ? viewWeek() : n === 'edit' ? viewEdit() : n === 'form' ? viewForm() : viewLog();
    window.scrollTo(0, y);
  }

  /* ---------- exercise state ---------- */
  function openEx(day, i) {
    var ex = S.menu[day][i];
    if (!ex) return;
    var t = computeTarget(ex), dr = S.draft[ex.id], sets;
    if (dr && dr.date === today() && dr.sets && dr.sets.length) sets = dr.sets;
    else sets = t.sets.map(function (s) { return { w: s.w == null ? '' : s.w, r: s.r, done: false }; });
    cur = { day: day, i: i, ex: ex, sets: sets, saved: false, err: '' };
    V = { name: 'ex', day: day, i: i };
    wake();
    render(false);
  }
  function persistDraft() {
    if (!cur) return;
    S.draft[cur.ex.id] = { date: today(), sets: cur.sets };
    save();
  }
  function setWeight(i, val) {
    cur.sets[i].w = val;
    for (var j = i + 1; j < cur.sets.length; j++) if (!cur.sets[j].done) cur.sets[j].w = val;
  }
  function toggleDone(i) {
    var s = cur.sets[i];
    if (!s.done) {
      if (s.w === '' || s.w == null || isNaN(Number(s.w))) { cur.err = 'SET ' + (i + 1) + ' の重量を入力してください。'; render(true); return; }
      if (!(Number(s.r) > 0)) { cur.err = 'SET ' + (i + 1) + ' の回数を入力してください。'; render(true); return; }
      s.done = true;
      cur.err = '';
      if (cur.sets.some(function (x) { return !x.done; })) startTimer(cur.ex.rest); else stopTimer();
    } else {
      s.done = false;
    }
    persistDraft();
    render(true);
  }
  function saveEx() {
    var done = cur.sets.filter(function (s) { return s.done; }).map(function (s) { return { w: Number(s.w), r: Number(s.r) }; });
    if (!done.length) return;
    var d = today(), ex = cur.ex;
    var pi = prInfo(ex, done, d);
    S.hist = S.hist.filter(function (h) { return !(h.date === d && h.id === ex.id); });
    S.hist.push({ date: d, ts: Date.now(), day: cur.day, id: ex.id, name: ex.name, sets: done, pr: { e: pi.e, w: pi.w } });
    delete S.draft[ex.id];
    save();
    stopTimer();
    cur.saved = true;
    render(false);
  }
  function stepW(i, dir) {
    var v = Math.max(0, r2((Number(cur.sets[i].w) || 0) + dir * stepOf(cur.ex)));
    setWeight(i, v); persistDraft(); render(true);
  }
  function stepR(i, dir) {
    cur.sets[i].r = Math.max(0, (Number(cur.sets[i].r) || 0) + dir);
    persistDraft(); render(true);
  }

  /* ---------- edit helpers ---------- */
  function formFrom(ex) {
    return { id: ex.id, name: ex.name, sets: String(ex.sets), min: String(ex.min), max: String(ex.max), rest: String(ex.rest), aim: ex.aim, alt: ex.alt, step: String(ex.step), bw: !!ex.bw };
  }
  function selectBk() { var t = el('bk'); if (t) { t.focus(); t.select(); } }
  function fallbackDownload(json, name) {
    try {
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      V.msg = 'ファイルの保存を開始しました。保存されない場合は「コピー」を使ってください。';
    } catch (e) { V.msg = 'この環境ではファイル保存が使えません。「コピー」を使ってください。'; }
    render(true);
  }

  /* ---------- events ---------- */
  var H = {
    day: function (b) { V = { name: 'day', day: b.dataset.d }; render(false); },
    ex: function (b) { openEx(V.day, Number(b.dataset.i)); },
    back: function () {
      if (V.name === 'ex') V = { name: 'day', day: cur.day };
      else if (V.name === 'trend') V = { name: 'trends' };
      else if (V.name === 'form') V = { name: 'edit', msg: '', confirm: '' };
      else V = { name: 'home' };
      render(false);
    },
    log: function () { V = { name: 'log', msg: '', bk: '', confirm: '' }; render(false); },
    week: function () { V = { name: 'week', off: 0 }; render(false); },
    wprev: function () { V.off -= 1; render(false); },
    wnext: function () { if (V.off < 0) { V.off += 1; render(false); } },
    trends: function () { V = { name: 'trends' }; render(false); },
    trendex: function (b) { V = { name: 'trend', id: b.dataset.id }; render(false); },
    edit: function () { V = { name: 'edit', msg: '', confirm: '' }; render(false); },
    eedit: function (b) {
      var d = b.dataset.d, i = Number(b.dataset.i), ex = S.menu[d][i];
      if (!ex) return;
      V = { name: 'form', day: d, idx: i, form: formFrom(ex), err: '', cdel: false }; render(false);
    },
    eadd: function (b) {
      V = { name: 'form', day: b.dataset.d, idx: null, form: { id: '', name: '', sets: '3', min: '8', max: '12', rest: '90', aim: '', alt: '', step: '2.5', bw: false }, err: '', cdel: false };
      render(false);
    },
    eup: function (b) { moveEx(b.dataset.d, Number(b.dataset.i), -1); },
    edn: function (b) { moveEx(b.dataset.d, Number(b.dataset.i), 1); },
    esave: function () {
      var f = V.form, name = (f.name || '').trim();
      var sets = parseInt(f.sets, 10), mn = parseInt(f.min, 10), mx = parseInt(f.max, 10), rest = parseInt(f.rest, 10), step = parseFloat(f.step);
      var err = '';
      if (!name) err = '種目名を入力してください。';
      else if (!(sets >= 1 && sets <= 10)) err = 'セット数は1〜10で入力してください。';
      else if (!(mn >= 1 && mn <= 100)) err = '回数の下限は1以上で入力してください。';
      else if (!(mx >= mn && mx <= 100)) err = '回数の上限は、下限以上で入力してください。';
      else if (!(rest >= 0 && rest <= 600)) err = '休憩は0〜600秒で入力してください。';
      else if (!(step > 0)) err = '増加幅は0より大きい数で入力してください。';
      if (err) { V.err = err; render(true); return; }
      var ex = normEx({ id: f.id || ('x' + Date.now().toString(36)), name: name, sets: sets, min: mn, max: mx, rest: rest, aim: f.aim, alt: f.alt, step: step, bw: f.bw });
      var list = S.menu[V.day];
      if (V.idx == null) list.push(ex); else list[V.idx] = ex;
      save();
      V = { name: 'edit', msg: '保存しました。', confirm: '' }; render(false);
    },
    edel: function () {
      if (!V.cdel) { V.cdel = true; render(true); return; }
      S.menu[V.day].splice(V.idx, 1);
      save();
      V = { name: 'edit', msg: '削除しました。過去の記録は履歴に残っています。', confirm: '' }; render(false);
    },
    ereset: function () {
      if (V.confirm !== 'reset') { V.confirm = 'reset'; V.msg = ''; render(true); return; }
      S.menu = clone(DEFAULT_MENU); save();
      V.confirm = ''; V.msg = '初期メニューに戻しました。'; render(true);
    },
    wm: function (b) { stepW(Number(b.dataset.i), -1); },
    wp: function (b) { stepW(Number(b.dataset.i), 1); },
    rm: function (b) { stepR(Number(b.dataset.i), -1); },
    rp: function (b) { stepR(Number(b.dataset.i), 1); },
    done: function (b) { toggleDone(Number(b.dataset.i)); },
    save: function () { saveEx(); },
    next: function () { openEx(cur.day, cur.i + 1); },
    list: function () { V = { name: 'day', day: cur.day }; render(false); },
    dl: function () {
      var json = JSON.stringify(S, null, 2), fn = 'training-log-' + today() + '.json';
      if (DL) {
        DL.save({ filename: fn, data: json }).then(function () {
          V.msg = 'ファイルに保存しました。'; render(true);
        }).catch(function (e) {
          if (e && e.code === 'declined') { V.msg = '保存をキャンセルしました。'; render(true); }
          else fallbackDownload(json, fn);
        });
      } else fallbackDownload(json, fn);
    },
    copy: function () {
      var json = JSON.stringify(S);
      V.bk = json; V.confirm = ''; V.msg = '下の欄にデータを出しました。コピーしてメモなどに保管してください。';
      render(true);
      try {
        navigator.clipboard.writeText(json).then(function () {
          V.msg = 'クリップボードにコピーしました。メモなどに貼り付けて保管してください。'; render(true);
        }).catch(function () { selectBk(); });
      } catch (e) { selectBk(); }
    },
    restore: function () {
      if (V.confirm !== 'restore') { V.confirm = 'restore'; V.msg = ''; render(true); return; }
      try {
        var o = JSON.parse((V.bk || '').trim());
        if (!o || !Array.isArray(o.hist)) throw new Error('bad');
        S = sanitize(o); save(); cur = null;
        V.msg = '復元しました。履歴 ' + S.hist.length + ' 件。';
      } catch (e) { V.msg = 'データを読み取れませんでした。コピーしたデータ全体を貼り付けてください。'; }
      V.confirm = ''; render(true);
    },
    wipe: function () {
      if (V.confirm !== 'wipe') { V.confirm = 'wipe'; V.msg = ''; render(true); return; }
      S = blank(); save(); cur = null; stopTimer();
      V.confirm = ''; V.bk = ''; V.msg = '全データを消去しました。'; render(true);
    }
  };
  function moveEx(d, i, dir) {
    var list = S.menu[d], j = i + dir;
    if (j < 0 || j >= list.length) return;
    var t = list[i]; list[i] = list[j]; list[j] = t;
    save(); render(true);
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || b.disabled) return;
    ensureAudio();
    var fn = H[b.dataset.act];
    if (fn) fn(b);
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.dataset || !t.dataset.in) return;
    var k = t.dataset.in;
    if (k === 'bk') { V.bk = t.value; return; }
    if (k === 'memo') { if (cur) { S.notes[cur.ex.id] = t.value; save(); } return; }
    if (k === 'body') { S.body = Math.max(0, num(t.value, 0)); save(); return; }
    if (k === 'f') { if (V.form) V.form[t.dataset.k] = t.value; return; }
    if (!cur) return;
    var i = Number(t.dataset.i), v = t.value === '' ? '' : parseFloat(t.value);
    if (v !== '' && isNaN(v)) v = '';
    if (k === 'w') {
      setWeight(i, v);
      for (var j = i + 1; j < cur.sets.length; j++) {
        if (!cur.sets[j].done) { var f = el('w' + j); if (f) f.value = v; }
      }
    } else if (k === 'r') {
      cur.sets[i].r = v;
    }
    persistDraft();
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'stepIn' && cur) {
      var v = parseFloat(t.value);
      if (v > 0) { S.steps[cur.ex.id] = v; save(); }
    }
    if (t.dataset && t.dataset.in === 'fb' && V.form) V.form.bw = !!t.checked;
  });
  el('timer').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-t]') : null;
    if (!b) return;
    ensureAudio();
    var k = b.dataset.t;
    if (k === 'skip') stopTimer();
    else adjustTimer(Number(k) * 1000);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { tick(); if (V.name === 'ex') wake(); }
  });

  /* ---------- start ---------- */
  render(false);
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (c) { DL = c || null; }).catch(function () {});
    }
  } catch (e) {}
  try {
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  } catch (e) {}

  if (window.__TL_TEST) {
    window.__TL_TEST({
      H: H, render: render, getS: function () { return S; }, setS: function (s) { S = sanitize(s); }, setV: function (v) { V = v; },
      getV: function () { return V; }, getCur: function () { return cur; }, computeTarget: computeTarget, weekInfo: weekInfo,
      addDays: addDays, today: today, findEx: findEx, bestOf: bestOf, seriesOf: seriesOf, app: app
    });
  }
})();
</script>
</body>
</html>
